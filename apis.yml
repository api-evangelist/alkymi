aid: alkymi
name: Alkymi
description: >-
  Alkymi is an enterprise AI platform for private markets data that uses secure
  large language models to extract and transform unstructured investment and
  financial documents into standardized, actionable datasets. The platform
  ingests capital notices, quarterly reports, financial statements, CIMs, loan
  agreements, and brokerage statements, then delivers structured data to
  downstream systems in real time. Product lines include Alkymi Alts,
  Alkymi Private Credit, Data Inbox, and Patterns. Alkymi exposes a
  developer-friendly REST API with event-based webhook support, email
  integrations, and user-triggered import/export, and integrates with SimCorp,
  Snowflake, Salesforce, FINBOURNE, Zapier, and Groq. It is backed by
  Canaan Partners.
